# Example workflow for ETF-based backtest
# Demonstrates price-based product backtesting using PriceReturnCalculator
#
# This workflow uses LQD (iShares Investment Grade Corporate Bond ETF)
# which is a price-quoted product (quote_type: price).
# The backtest engine automatically selects PriceReturnCalculator
# based on the product's quote_type in bloomberg_securities.json.
#
# P&L formula for price products:
#   P&L = Position × (Price[t]/Price[t-1] - 1) × Notional

# Required: Label for workflow identification
label: etf_backtest

# Signal to compute (must exist in signal_catalog.json)
# Note: cdx_etf_basis requires both CDX and ETF data
signal: cdx_etf_basis

# Product to backtest (must exist in bloomberg_securities.json)
# LQD is an ETF with quote_type: price
product: lqd

# Strategy from strategy_catalog.json
strategy: balanced

# Data source: 'synthetic' for testing, 'bloomberg' for production
data: synthetic

# Optional: Override default securities for signal computation
# Uncomment to use different securities than signal defaults
# security_mapping:
#   cdx: cdx_ig_5y
#   etf: lqd

# Optional: Override DV01 (not applicable for price products)
# dv01_per_million_override: null

# Optional: Override transaction cost
# transaction_cost_bps_override: 0.5

# Optional: Use percentage-based transaction cost (industry standard: 2.5%)
# transaction_cost_pct_override: 0.025

# Optional: Skip steps (run only specific parts of workflow)
# skip_steps:
#   - suitability
#   - visualization

# Optional: Force re-run ignoring cache
# force: true
