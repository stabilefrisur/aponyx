# Workflow configuration with custom security mapping
# Usage: aponyx run --config workflow_custom_securities.yaml

# Run cdx_etf_basis signal with CDX HY vs HYG and trade iTraxx Crossover
# Default for product is cdx_ig_5y
signal: cdx_etf_basis
strategy: balanced
product: itrx_xover_5y
data: bloomberg

# Override default securities for signal computation
# Default for cdx_etf_basis is: cdx_ig_5y vs lqd
securities:
  cdx: cdx_hy_5y
  etf: hyg
