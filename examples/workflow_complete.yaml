# Complete workflow configuration
# All fields explicitly specified (no defaults used)
#
# Four-Stage Transformation Pipeline:
#   Security → Indicator Transform → Score Transform → Signal Transform → Position
#
# Each signal composes:
#   1. indicator (transformation)  - Raw metric in interpretable units (bps, ratios)
#   2. score_transformation        - Normalization (z-score, volatility adjustment)
#   3. signal_transformation       - Trading rules (floor, cap, neutral_range)
#
# Product Microstructure (automatic):
#   DV01 and transaction costs loaded from bloomberg_securities.json based on product.
#   Override with: dv01_per_million_override, transaction_cost_bps_override, or transaction_cost_pct_override
#
# Data Channels:
#   Each security can have multiple data channels (spread, price, level).
#   Channel selection is automatic based on usage purpose:
#   - INDICATOR: Uses instrument_type defaults (CDX→spread, VIX→level, ETF→spread)
#   - PNL: Uses quote_type from security spec (spread-quoted→spread, price-quoted→price)
#   - DISPLAY: Uses instrument_type defaults, overridable with display_channel

label: complete_test
signal: cdx_etf_basis
product: cdx_ig_5y
strategy: balanced

# Optional: Override transformations from signal defaults
# - indicator: Override raw indicator computation
# - score_transformation: Override normalization method
# - signal_transformation: Override trading rule bounds
indicator: cdx_etf_spread_diff
score_transformation: z_score_20d
signal_transformation: bounded_1_5

# Optional: Override default securities for the indicator
securities:
  cdx: cdx_ig_5y
  etf: lqd

# Optional: Override product microstructure (uncomment to use)
# dv01_per_million_override: 500.0         # Override product's DV01
# transaction_cost_bps_override: 2.5       # Fixed bps override (OR)
# transaction_cost_pct_override: 0.025     # Percentage of spread (mutually exclusive with bps)

# Optional: Override display channel for visualization
# By default, charts use instrument_type defaults (spread for CDX, level for VIX)
# Override to show different channel in visualizations:
# display_channel: price                   # Options: spread, price, level

# Data source (synthetic, file, bloomberg)
data: synthetic

# Execute specific steps only
steps: [data, signal, suitability, backtest, performance, visualization]

# Force re-run all steps (skip cache)
force: true
