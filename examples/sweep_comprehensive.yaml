# Comprehensive Parameter Sweep Example
# =====================================
# Demonstrates sweeping all parameter types in pipeline order:
# 1. Indicator transformation parameters (indicator_transformation.parameters.*)
# 2. Score transformation parameters (score_transformation.parameters.*)
# 3. Signal transformation parameters (signal_transformation.parameters.*)
# 4. Strategy parameters (strategy.*)

name: "comprehensive_sweep"
description: "Sweep all parameter types to find optimal configuration"
mode: "backtest"

base:
  signal: "spread_momentum"  # Uses spread_momentum_5d indicator (has lookback param)
  strategy: "balanced"

parameters:
  # =========================================================================
  # STAGE 1: INDICATOR TRANSFORMATION (indicator_transformation.parameters.*)
  # =========================================================================
  # Lookback period for momentum calculation (days)
  - path: "indicator_transformation.parameters.lookback"
    values: [5, 10]

  # =========================================================================
  # STAGE 2: SCORE TRANSFORMATION (score_transformation.parameters.*)
  # =========================================================================
  # Rolling window for z-score normalization
  - path: "score_transformation.parameters.window"
    values: [20, 40]

  # Minimum periods required before computing z-score
  - path: "score_transformation.parameters.min_periods"
    values: [10, 20]

  # =========================================================================
  # STAGE 3: SIGNAL TRANSFORMATION (signal_transformation.parameters.*)
  # =========================================================================
  # Scaling multiplier applied to score
  - path: "signal_transformation.parameters.scaling"
    values: [1.0, 2.0]

  # Lower bound for signal (clipping)
  - path: "signal_transformation.parameters.floor"
    values: [-1.5, -2.0]

  # Upper bound for signal (clipping)
  - path: "signal_transformation.parameters.cap"
    values: [1.5, 2.0]

  # =========================================================================
  # STAGE 4: STRATEGY / BACKTEST (strategy.*)
  # =========================================================================
  # Position sizing in millions notional
  - path: "strategy.position_size_mm"
    values: [5.0, 10.0]

  # Entry threshold - minimum signal strength to open position
  - path: "strategy.entry_threshold"
    values: [1.0, 1.5]

  # Stop loss percentage
  - path: "strategy.stop_loss_pct"
    values: [5.0, 10.0]

  # Take profit percentage
  - path: "strategy.take_profit_pct"
    values: [10.0, 15.0]

  # Maximum holding period in days
  - path: "strategy.max_holding_days"
    values: [20, 30]

# Total combinations: 2^11 = 2,048
# Set to null to run all combinations
max_combinations: 200
